name: Update EPL Data

on:
  schedule:
    # Daily at 08:00 UTC (catches weekend, Monday, and midweek fixtures)
    - cron: '0 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - "index.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: epl-raw-v1
          restore-keys: |
            epl-raw-

      - name: Run pipeline
        run: |
          python scripts/01_clean.py
          python scripts/03_fetch_fpl.py || echo "FPL fetch failed -- continuing"
          python scripts/04_fetch_xg.py || echo "xG fetch failed -- continuing"
          python scripts/02_transform.py

      - name: Verify output
        run: |
          if [ ! -f data/dashboard_data.json ]; then
            echo "ERROR: dashboard_data.json was not generated"
            exit 1
          fi
          echo "Dashboard data size: $(wc -c < data/dashboard_data.json) bytes"

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/dashboard_data.json _site/data/
          if [ -d docs ]; then cp -r docs _site/docs; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
